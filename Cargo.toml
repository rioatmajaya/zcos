[workspace]
resolver = "3"
members = [
    "boot/uefi-loader",
    "kernel/zc-kernel",
    "libs/zc-abi",
    "libs/zc-elf",
]

# The kernel image is a freestanding `x86_64-unknown-none` binary. It is built
# by the boot tooling with an explicit target, so it is excluded from the host
# workspace (its `no_std`/`no_main` binary would otherwise fail `cargo test`).
# The userspace tasks are freestanding for the same reason.
exclude = [
    "kernel/zc-kernel-image",
    "user/zc-blk",
    "user/zc-consumer",
    "user/zc-devmgr",
    "user/zc-initd",
    "user/zc-kbd",
    "user/zc-producer",
    "user/zc-shell",
    "user/zc-user",
    "user/zcompositor",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zc-os/zcos"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
