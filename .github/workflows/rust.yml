name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build workspace
      run: cargo build --workspace --verbose
    - name: Run host tests
      run: cargo test --workspace --verbose

  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check the changelog has an Unreleased section
      run: |
        test -f CHANGELOG.md
        grep -q '^## \[Unreleased\]' CHANGELOG.md

  boot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install QEMU, OVMF, and image tools
      run: |
        echo -e "nameserver 8.8.8.8\nnameserver 1.1.1.1" | sudo tee /etc/resolv.conf
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools e2fsprogs
    - name: Install boot targets
      run: |
        rustup target add x86_64-unknown-uefi
        rustup target add x86_64-unknown-none
    - name: Build bootable image
      run: ./tools/build-efi.sh --test
    - name: Boot test in QEMU
      run: ./tools/run-qemu.sh --test > build/boot.log 2>&1
    - name: Check boot diagnostics
      run: |
        cat build/boot.log
        grep -q "ZC OS UEFI loader" build/boot.log
        grep -q "framebuffer" build/boot.log
        grep -q "memory map:" build/boot.log
        grep -q "entering kernel" build/boot.log
        grep -q "ZC OS kernel" build/boot.log
        grep -q "boot protocol v2 ok" build/boot.log
        grep -q "mechanisms self-test ok" build/boot.log
        grep -q "traps: idt installed" build/boot.log
        grep -q "syscall gate probe: 1" build/boot.log
        grep -q "timer: 16 ticks" build/boot.log
        grep -q "timer: calibrated bus" build/boot.log
        grep -q "user: exited" build/boot.log
        grep -q "task 0: producer sent 2000" build/boot.log
        grep -q "task 1: consumer received 2000" build/boot.log
        grep -q "task 1: hello verified" build/boot.log
        grep -q "task 0: manifest ok" build/boot.log
        grep -q "task 2: Commands: help echo cd pwd cat head wc grep test true false export set unset env ls stat touch cp write append rm mkdir rmdir mv sync tmp persist chmod mount umount id svc dev uname free ps spawn kill wait notify event session signal raise dmesg date uptime sh source poweroff exit" build/boot.log
        grep -F -q "$(printf 'task 2: /data\r')" build/boot.log
        grep -F -q "$(printf 'task 2: /tmp\r')" build/boot.log
        grep -q "task 2: cd: no such file or directory" build/boot.log
        grep -q "task 2: cd: not a directory" build/boot.log
        # Shell redirection and exit status tracking (ADR 0101).
        grep -q "task 2: redir_one" build/boot.log
        grep -q "redir_two" build/boot.log
        grep -q "task 2: rm: removed redir.txt" build/boot.log
        grep -q "task 2: rm: removed redir_pwd.txt" build/boot.log
        grep -q "task 2: redir: cannot open file" build/boot.log
        grep -F -q "$(printf 'task 2: 1\r')" build/boot.log
        grep -F -q "$(printf 'task 2: 0\r')" build/boot.log
        # Pattern search and conditional testing (ADR 0102).
        grep -q "task 2: 1:hello from the ZC OS initramfs" build/boot.log
        grep -q "task 2: rm: removed grep_out.txt" build/boot.log
        # Command chaining and conditional operators (ADR 0103).
        grep -q "task 2: chain_one" build/boot.log
        grep -q "task 2: chain_two" build/boot.log
        grep -q "task 2: chain_and_ok" build/boot.log
        grep -q "task 2: chain_or_ok" build/boot.log
        # Environment variables and parameter expansion (ADR 0104).
        grep -q "task 2: zcos_env_ok" build/boot.log
        grep -q "task 2: env_test_ok" build/boot.log
        # Pipeline execution (ADR 0105).
        grep -q "task 2: zcos_pipe_ok" build/boot.log
        grep -q "task 2: wc: lines 1 words 1 bytes 4" build/boot.log
        grep -q "task 2: pipe_and_ok" build/boot.log
        # Shell script execution and comment parsing (ADR 0106).
        grep -q "task 2: zcos_sh_ok sh_arg 1" build/boot.log
        grep -q "task 2: zcos_sh_ok src_arg 1" build/boot.log
        grep -q "task 2: rm: removed /tmp/test_sh.sh" build/boot.log
        grep -q "task 2: zcos_sh_c_ok" build/boot.log
        grep -q "task 2: zcos_comment_ok" build/boot.log
        grep -q "task 2: relative.txt: file, 8 bytes" build/boot.log
        grep -q "task 2: rm: removed relative.txt" build/boot.log
        grep -q "task 2: touch: created /tmp/touched" build/boot.log
        grep -q "task 2: cp: copied hello.txt -> /tmp/hello-copy.txt" build/boot.log
        grep -q "task 2: wc: lines 1 words 6 bytes 31 /tmp/hello-copy.txt" build/boot.log
        grep -q "task 2: hello os" build/boot.log
        grep -q "task 2: hello from the ZC OS initramfs" build/boot.log
        grep -q "task 2: hello.txt: file, 31 bytes" build/boot.log
        grep -q "task 2: shell exiting" build/boot.log
        grep -q "vfs: mounted ramfs at /" build/boot.log
        # The kernel no longer scans PCI: the device manager does, from ring 3,
        # and brokers the BAR it finds (ADR 0019).
        ! grep -q "^pci:" build/boot.log
        grep -q "task 4: blk: disk magic ok" build/boot.log
        grep -q "task 4: blk: write ok" build/boot.log
        grep -q "task 4: blk: flush ok" build/boot.log
        grep -q "task 4: blk: readback ok" build/boot.log
        grep -q "task 4: blk: cache miss" build/boot.log
        grep -q "task 4: blk: cache hit" build/boot.log
        grep -q "task 4: blk: cache dirty hit" build/boot.log
        grep -q "task 4: blk: cache evicted dirty" build/boot.log
        grep -q "task 4: blk: cache flushed" build/boot.log
        grep -q "task 4: blk: cache durable" build/boot.log
        grep -q "task 4: blk: fs mbr ok" build/boot.log
        grep -q "task 4: blk: fs mount ok" build/boot.log
        grep -q "task 4: blk: fs root ok" build/boot.log
        grep -q "task 4: blk: fs hello ok" build/boot.log
        grep -q "task 4: blk: ext2 mbr ok" build/boot.log
        grep -q "task 4: blk: ext2 mount ok" build/boot.log
        grep -q "task 4: blk: ext2 root ok" build/boot.log
        grep -q "task 4: blk: ext2 hello ok" build/boot.log
        grep -q "task 4: blk: zcfs mbr ok" build/boot.log
        grep -q "task 4: blk: zcfs mount ok" build/boot.log
        grep -q "task 4: blk: zcfs recovered" build/boot.log
        grep -q "task 4: blk: zcfs dirty" build/boot.log
        grep -q "task 4: blk: zcfs fsck repaired" build/boot.log
        grep -q "task 4: blk: zcfs probe ok" build/boot.log
        grep -q "task 4: blk: zcfs write ok" build/boot.log
        grep -q "task 4: blk: zcfs replay ok" build/boot.log
        grep -q "vfs: mounted zcfs at /data" build/boot.log
        grep -q "vfs: mounted tmpfs at /tmp" build/boot.log
        grep -q "vfs: mounted devfs at /dev" build/boot.log
        grep -q "task 4: blk: zcfs serving" build/boot.log
        grep -q "task 2: write: ok" build/boot.log
        grep -q "task 2: /data/probe: file, 10 bytes" build/boot.log
        grep -q "vfs: persistence ok" build/boot.log
        # `sync` flushes the zcfs cache and stamps the volume clean.
        grep -q "task 2: sync: ok" build/boot.log
        grep -q "task 4: blk: synced" build/boot.log
        # `rm` on /data appends a durable unlink record; the remount replays
        # it, so the file stays gone after the explicit umount/mount pair.
        grep -q "task 2: rm: removed /data/probe" build/boot.log
        grep -q "task 2: umount: /data ok" build/boot.log
        grep -q "task 2: mount: /data ok" build/boot.log
        # `mkdir` on /data rides the same `CREATE` record the proxy already
        # uses, with the directory type bit in the mode, so the directory
        # survives the explicit umount/mount pair as a durable node.
        grep -q "task 2: mkdir: made /data/atlas" build/boot.log
        grep -q "task 2: /data/atlas: dir, 0 bytes, mode 0755, uid 0 gid 0" build/boot.log
        # `rmdir` on /data appends a durable RMDIR record too, so the empty
        # directory stays gone after the explicit umount/mount pair.
        grep -q "task 2: rmdir: removed /data/atlas" build/boot.log
        # `mv` on /data appends a durable RENAME record, so the moved name
        # survives the explicit umount/mount pair.
        grep -q "task 2: mv: moved /data/empty -> /data/moved" build/boot.log
        grep -q "task 2: /data/moved: file, 1 bytes" build/boot.log
        grep -q "task 2: tmp: ok" build/boot.log
        grep -q "task 2: /dev/blk: char device" build/boot.log
        grep -q "task 2: uid=1 gid=1" build/boot.log
        grep -q "task 2: svc: blk up ready" build/boot.log
        grep -q "task 2: svc: kbd up ready" build/boot.log
        # The kernel counts the deliberate faults and the respawns the
        # supervisor asks for; `svc` reads them through SYS_SERVICE_HEALTH.
        grep -q "task 2: svc: blk up ready restarts=1 faults=1" build/boot.log
        grep -q "task 2: svc: kbd up ready restarts=1 faults=1" build/boot.log
        # Runtime discovery (ADR 0084): blk publishes the channel it serves
        # on, the shell resolves the name the way any client would, and the
        # claim dies with the incarnation that made it.
        grep -q "task 4: blk: endpoint 2 published" build/boot.log
        grep -q "task 2: svc: blk up ready restarts=1 faults=1 endpoint=2" build/boot.log
        grep -q "service blk endpoint 2 withdrawn" build/boot.log
        # `ps` reads the generation, so a revived service is distinguishable
        # from its first incarnation even though it keeps its slot index.
        grep -q "task 2: ps: slot 4 gen 2 uid=1 gid=1 up ready" build/boot.log
        grep -q "task 2: ps: slot 5 gen 2 uid=1 gid=1 up ready" build/boot.log
        # A dead slot reports the status its task passed to SYS_TASK_EXIT, and
        # the shell's own clean exit is recorded the same way.
        grep -q "task 2: ps: slot 6 gen 1 uid=1 gid=1 down status=0" build/boot.log
        grep -q "task 2: exited status 0" build/boot.log
        # Sessions are spawn-time data: the shell leads the desktop session and
        # the root supervisor stays in the system session.
        grep -q "task 2: uid=1 gid=1 sid=1" build/boot.log
        grep -q "task 2: ps: slot 7 gen 1 uid=0 gid=0 up sid=0" build/boot.log
        # `dmesg` reads the kernel's own ring, not the task transcript: the
        # banner only appears with a `task 2:` prefix when the shell copied it
        # out through SYS_LOG_READ.
        grep -q "task 2: ZC OS kernel" build/boot.log
        grep -q "task 2: /tmp/scratch: file, 8 bytes, mode 0644, uid 1 gid 1" build/boot.log
        grep -q "task 2: chmod: ok" build/boot.log
        grep -q "audit: task 2 denied read /tmp/scratch" build/boot.log
        grep -q "task 2: cat: cannot open" build/boot.log
        # `rm` removes the tmpfs scratch file through the same VFS write path
        # `write` uses, and the file is gone from `stat` afterwards.
        grep -q "task 2: rm: removed /tmp/scratch" build/boot.log
        grep -q "task 2: stat: no such file" build/boot.log
        # The scratch filesystem holds directories too, so a file can be made
        # below one and still resolve through the VFS.
        grep -q "task 2: mkdir: made /tmp/dir" build/boot.log
        grep -q "task 2: /tmp/dir/f: file, 5 bytes, mode 0644, uid 1 gid 1" build/boot.log
        # `rmdir` refuses a directory that still holds a child, then succeeds
        # once the child is gone.
        grep -q "task 2: rmdir: cannot remove" build/boot.log
        grep -q "task 2: rmdir: removed /tmp/dir" build/boot.log
        # `mv` renames within the scratch filesystem, and the file resolves
        # under its new name.
        grep -q "task 2: mv: moved /tmp/a -> /tmp/b" build/boot.log
        grep -q "task 2: /tmp/b: file, 4 bytes, mode 0644, uid 1 gid 1" build/boot.log
        # `append` seeks to the current end, so the bytes grow instead of
        # overwriting from offset zero.
        grep -q "task 2: append: ok" build/boot.log
        grep -q "task 2: AB" build/boot.log
        # The shell reaps the bring-up pair, then spawns fresh incarnations by
        # image name. Generation 2 in `ps` proves the slot counter survived the
        # reap (ADR 0070); the lone producer blocks on the full endpoint, so it
        # is deterministically still up when `ps` runs.
        grep -q "task 2: wait: task 0 exited status 0" build/boot.log
        grep -q "task 2: wait: task 1 exited status 0" build/boot.log
        grep -q "task 2: spawn: task 0 running producer.elf" build/boot.log
        grep -q "task 2: ps: slot 0 gen 2 uid=1 gid=1 up" build/boot.log
        grep -q "task 2: spawn: task 1 running consumer.elf" build/boot.log
        # A reap returns the frames only a runtime spawn owns: four private
        # table levels, one image page, and one stack page for each proof
        # image. The bring-up pair has an empty ledger, so its first waits
        # print no reclaim line at all.
        grep -q "wait: task 2 reclaimed 6 frames from task 0" build/boot.log
        grep -q "wait: task 2 reclaimed 6 frames from task 1" build/boot.log
        # A kill is the inverse of a spawn: the shell ends a runtime-spawned
        # consumer with status 7, while a boot-layout task and a supervised
        # service are refused because their lifecycles are not a peer's to
        # take. The wait after the kill reaps the record and its frames.
        grep -q "kill: task 2 refused boot task 7" build/boot.log
        grep -q "kill: task 2 refused supervised task 4" build/boot.log
        grep -q "task 2: kill: cannot kill" build/boot.log
        grep -q "task 2: spawn: task 0 running consumer.elf" build/boot.log
        grep -q "kill: task 2 killed task 0 status 7" build/boot.log
        grep -q "task 2: ps: slot 0 gen 3 uid=1 gid=1 down status=7 sid=1" build/boot.log
        grep -q "wait: task 2 reaped task 0 status 7" build/boot.log
        grep -q "task 2: wait: task 0 exited status 7" build/boot.log
        # An event word is a coalescing flag set, not a queue. The waiter
        # raises bit 1, blocks for bit 2, and the shell consumes bit 1, raises
        # bit 2, and waits for the status. The ordering makes the block path
        # deterministic: the shell cannot raise bit 2 until the waiter is
        # waiting, and the waiter cannot exit until it consumed bit 2.
        grep -q "task 2: spawn: task 0 running .waiter.elf" build/boot.log
        grep -q "task 0: waiter running" build/boot.log
        grep -q "task 0: waiter waiting" build/boot.log
        grep -q "notify: task 0 notified task 2 bits 1" build/boot.log
        grep -q "event: task 2 took 1" build/boot.log
        grep -q "task 2: event: got 1" build/boot.log
        grep -q "notify: task 2 notified task 0 bits 2" build/boot.log
        grep -q "task 2: notify: task 0 bits 2" build/boot.log
        grep -q "task 0: waiter woke" build/boot.log
        grep -q "wait: task 2 reaped task 0 status 2" build/boot.log
        grep -q "task 2: wait: task 0 exited status 2" build/boot.log
        # Notification is peer traffic inside one session, not lifecycle
        # authority: the shell cannot raise a bit on the system-session block
        # driver, and no capability changes that.
        grep -q "notify: task 2 refused session 0 task 4" build/boot.log
        grep -q "task 2: notify: cannot notify" build/boot.log
        grep -q "task 2: session: created" build/boot.log
        grep -q "task 2: signal: registered" build/boot.log
        grep -q "task 2: signal: handled" build/boot.log
        grep -q "task 2: raise: ok" build/boot.log
        # A signal raised on a peer is delivered at the peer's next kernel
        # entry: the waiter is blocked in its event wait when the signal
        # arrives, so the kernel delivers the signal there, the handler runs
        # on the waiter's own stack, and the interrupted wait starts again
        # when the handler returns. The waiter still wakes on its bit and
        # exits with the same status, so the wait above proves the delivery
        # did not cost the task its work.
        grep -q "signal: task 0 registered 1" build/boot.log
        grep -q "raise: task 2 raised 1 on 0" build/boot.log
        grep -q "signal: delivered 1 to 0" build/boot.log
        grep -q "task 0: signal: handled" build/boot.log
        grep -q "task 0: hello from C" build/boot.log
        # `date` inspects the system clock via SYS_CLOCK (ADR 0093).
        grep -q "task 2: date: 12:00:00 (proof)" build/boot.log
        # `uname` and `dev` inspect OS and devices (ADR 0094).
        grep -q "task 2: ZC OS zcos 0.1.0 x86_64" build/boot.log
        grep -q "task 2: dev: blk (char)" build/boot.log
        grep -q "task 2: dev: kbd (char)" build/boot.log
        # Standard character devices in devfs and health classification (ADR 0107).
        grep -q "task 2: dev: null (char)" build/boot.log
        grep -q "task 2: dev: zero (char)" build/boot.log
        grep -q "task 2: dev: urandom (char)" build/boot.log
        grep -q "task 2: /dev/null: char device, mode 0666" build/boot.log
        grep -q "task 2: /dev/zero: char device, mode 0666" build/boot.log
        grep -q "task 2: /tmp/zero_test.txt: file, 4 bytes" build/boot.log
        grep -q "task 2: svc: blk up ready restarts=1 faults=1 endpoint=2 health=degraded requires=none" build/boot.log
        grep -q "task 2: svc: kbd up ready restarts=1 faults=1 health=degraded requires=none" build/boot.log
        # `free` inspects physical memory via SYS_MEM_INFO (ADR 0095).
        grep -q "task 2: mem: total " build/boot.log
        # `uptime` inspects system monotonic time via SYS_UPTIME (ADR 0096).
        grep -q "task 2: uptime: " build/boot.log
        # A missing image and a supervised slot both fail closed; the kernel
        # logs the reason and the shell reports the neutral failure.
        grep -q "spawn: task 2 found no image nothere.elf" build/boot.log
        grep -q "task 2: spawn: cannot spawn" build/boot.log
        grep -q "wait: task 2 refused supervised task 4" build/boot.log
        grep -q "task 2: wait: cannot wait" build/boot.log
        grep -q "task 4: blk: zcfs stopped" build/boot.log
        grep -q "user: 10 address spaces" build/boot.log
        grep -q "device: 3 roles, 7 grants (blk 0, kbd 4, devmgr 3)" build/boot.log
        grep -q "service: 2 roles, 5 grants (initd -> blk, kbd; shell -> status, spawn)" build/boot.log
        grep -q "task 7: initd: root identity" build/boot.log
        # The kernel reads the manifest's service order at boot.
        grep -q "manifest: services=blk,kbd" build/boot.log
        grep -q "task 7: initd: manifest ok" build/boot.log
        grep -qE "task 7: initd: discovered blk (up|down)" build/boot.log
        # The keyboard domain faults on purpose at boot, so the state the
        # supervisor finds it in is a race: it may still be up, or already
        # down and waiting for the revive below. The discovery line is the
        # claim, so the check names the service and leaves the state open.
        grep -qE "task 7: initd: discovered kbd (up|down)" build/boot.log
        # The manifest is authoritative for the supervised set and order.
        grep -q "task 7: initd: supervising blk,kbd" build/boot.log
        grep -q "cap: task 6 delegated" build/boot.log
        grep -q "to task 4" build/boot.log
        grep -q "iomap: task 4 now holds 256 ports" build/boot.log
        grep -q "iomap: task 6 now holds 8 ports" build/boot.log
        grep -q "task 6: devmgr: blk published" build/boot.log
        # Device memory is brokered the same way as I/O (ADR 0020): the manager
        # discovers the AHCI BAR, the kernel validates and records a range it
        # never knew, and the domain maps its own registers uncached. A range
        # the kernel owns is refused, so brokering leaks no memory.
        grep -q "task 6: devmgr: mmio ram range refused" build/boot.log
        grep -q "task 6: devmgr: mmio oversized refused" build/boot.log
        grep -q "mmio: task 6 delegated" build/boot.log
        grep -q "to task 6" build/boot.log
        grep -q "task 6: mmio: task 6 mapped ahci" build/boot.log
        ! grep -q "devmgr: mmio ram range accepted" build/boot.log
        ! grep -q "devmgr: mmio oversized accepted" build/boot.log
        ! grep -q "devmgr: ahci registers unexpected" build/boot.log
        # A role that drives a DMA device gets a coherent window at spawn: the
        # kernel allocates one contiguous run, maps it at a fixed address, and
        # publishes the device-visible base; the manager writes proof words
        # through the virtual alias and the kernel reads them back through the
        # physical one, so a match proves the two are the same frames.
        grep -q "dma: window 65536 bytes at 0x2400000" build/boot.log
        grep -q "task 6: devmgr: dma window at" build/boot.log
        grep -q "dma: window coherent ok" build/boot.log
        ! grep -q "dma: window coherent FAILED" build/boot.log
        ! grep -q "dma window needs contiguous frames" build/boot.log
        grep -q "task 4: blk: discovery received" build/boot.log
        grep -q "iomap: task 5 now holds 3 ports" build/boot.log
        grep -q "kbd: unprovided source correctly refused" build/boot.log
        grep -q "kbd: unprovided ports correctly refused" build/boot.log
        grep -q "task 5: kbd: irq 33 delivered" build/boot.log
        grep -q "kbd: irq 34 delivered, mouse queue ready" build/boot.log
        grep -q "kbd: task 5 released 3 ports" build/boot.log
        grep -q "fault vector 13 (general protection)" build/boot.log
        grep -q "task 7: initd: kbd down" build/boot.log
        grep -q "task 7: initd: restarted kbd" build/boot.log
        grep -q "task 7: service kbd started, task 5 revived" build/boot.log
        grep -q "task 5: kbd: serving" build/boot.log
        grep -q "task 7: initd: kbd stopped" build/boot.log
        ! grep -q "forbidden port read succeeded" build/boot.log
        grep -q "input: loopback ok" build/boot.log
        grep -q "input: mouse loopback ok" build/boot.log
        grep -q "input: irq self-test ok" build/boot.log
        grep -q "input: mouse irq self-test ok" build/boot.log
        grep -q "surface: factory granted to task 3" build/boot.log
        grep -q "task 3: compositor: surface 1280x800 stride 1280 at 0x1400000" build/boot.log
        grep -q "cap: task 3 delegated 0x20000001 to task 8" build/boot.log
        grep -q "task 8: client: window painted" build/boot.log
        grep -q "task 3: compositor: frame 0 painted" build/boot.log
        grep -q "task 3: wm: window mapped" build/boot.log
        grep -q "task 3: compositor: damage ok" build/boot.log
        grep -q "task 3: wm: move ok" build/boot.log
        grep -q "task 3: compositor: frame updated" build/boot.log
        grep -q "task 3: compositor: ready" build/boot.log
        # The scripted single-window image deliberately keeps the same `win.elf`
        # binary as its second client (distinguished only by its task slot and
        # window id): it learns its id and exits cleanly, so the 12-file
        # initramfs, the `ls` listing, and the checksum stay unchanged. The
        # default human image runs `fm.elf` here instead (ADR 0045).
        grep -q "win1 entry" build/boot.log
        grep -q "task 9: client: window 1 idle" build/boot.log
        grep -q "wm: content ok" build/boot.log
        grep -q "wm: vfs content ok" build/boot.log
        grep -q "task 8: client: vfs ok" build/boot.log
        # The font is an initramfs asset now (ADR 0031): all three text
        # renderers load it through the VFS, and none may silently fall back.
        grep -q "task 8: client: font vfs ok" build/boot.log
        grep -q "task 3: compositor: font vfs ok" build/boot.log
        grep -q "font: vfs ok" build/boot.log
        ! grep -q "font embedded fallback" build/boot.log
        ! grep -q "window script read no file" build/boot.log
        ! grep -q "window content mismatch" build/boot.log
        # The pointer is composited topmost and the kernel recomputes its sprite
        # from the same reports it served; the compositor moves it with damage
        # tracking, so the session logs a move and the verifier confirms every
        # sprite pixel instead of trusting the compositor's position.
        grep -q "task 3: compositor: cursor moved" build/boot.log
        grep -q "task 3: compositor: cursor ok" build/boot.log
        grep -q "fb: cursor ok" build/boot.log
        # A window has its own pointer stream (F8e-3, ADR 0034): the kernel
        # derives a window-local copy of the reports inside the content area and
        # the client reads it through SYS_WINDOW_READ. Both ends must log, or the
        # stream was produced but never crossed the syscall.
        grep -q "wm: pointer routed" build/boot.log
        grep -q "task 8: client: pointer ok" build/boot.log
        # The whole scripted pointer session was served, not cut short: the
        # kernel names how many reports each window's queue held when the
        # last step went out.
        grep -q "wm: mouse script served" build/boot.log
        # The strip's widgets, and a scripted detour the verifier replays
        # (F8e-4, ADR 0035; the reset target, ADR 0088; the focus, ADR 0089).
        # The client must have hit both widgets and taken the focus, and the
        # kernel must have derived the same presses, or the content check
        # would be trusting the client's labels rather than recomputing them.
        grep -q "task 8: client: click ok" build/boot.log
        grep -q "task 8: client: reset ok" build/boot.log
        grep -q "task 8: client: focus ok" build/boot.log
        grep -q "wm: click ok" build/boot.log
        grep -q "wm: reset ok" build/boot.log
        grep -q "wm: focus ok" build/boot.log
        # A directory can be listed (F8h-0, ADR 0036). The shell's `ls` walks the
        # root and /dev through SYS_READDIR; the window's scripted `ls` is the
        # same command over the client's syscall and the kernel's mount table,
        # and both ends must log an entry, not just agree on a failure.
        grep -q "task 2: data/" build/boot.log
        # `kbd` alone, not `kbd.elf`: the root listing also contains the ELF,
        # and a substring match would let a broken /dev listing pass. The `.`
        # consumes the serial log's trailing carriage return.
        grep -qE "task 2: kbd.$" build/boot.log
        # zcfs lists too (F8h-0b): the shell's `ls /data` runs after `persist`
        # remounts the volume, so the entry comes from the replayed table.
        grep -q "task 2: probe" build/boot.log
        grep -q "task 8: client: ls ok" build/boot.log
        grep -q "wm: ls ok" build/boot.log
        # The pointer is not just drawn, it is driven: the scripted mouse session
        # presses the left button on the window's title bar, drags the window off
        # its scripted frame position, releases, clicks the minimize glyph, and
        # clicks the taskbar's task button to bring it back. The window machine
        # runs on both sides (ADR 0024), so the desktop checksum still recomputes
        # the desktop exactly around wherever the window ended up — and this
        # variant leaves the window on screen, which is what proves the compositor
        # placed the client's pixels (ADR 0018).
        grep -q "compositor: window dragged" build/boot.log
        grep -q "compositor: window minimized" build/boot.log
        grep -q "compositor: window restored" build/boot.log
        ! grep -q "compositor: window closed" build/boot.log
        ! grep -q "cursor checksum mismatch" build/boot.log
        ! grep -q "desktop checksum mismatch" build/boot.log
        ! grep -q "window placement mismatch" build/boot.log
        ! grep -q "fb: no window, placement skipped" build/boot.log
        # The proof image keeps the fixed clock label (F8h-2, ADR 0046): the
        # taskbar is byte-identical to the recorded frame, and a live reading
        # here would silently change the checksum.
        grep -q "clock: proof" build/boot.log
        grep -q "compositor: clock fixed" build/boot.log
        ! grep -q "compositor: clock tick" build/boot.log
        grep -q "fb: desktop checksum ok" build/boot.log
        grep -q "switches" build/boot.log
        grep -q "acpi: rsdp v2" build/boot.log
        grep -q "initramfs: 14 files" build/boot.log
        grep -q "task 4: blk: resuming" build/boot.log
        grep -q "task 7: initd: blk down" build/boot.log
        grep -q "task 7: service blk started, task 4 revived" build/boot.log
        grep -q "task 7: initd: restarted blk" build/boot.log
        grep -q "task 4: blk: zcfs serving" build/boot.log
        grep -q "task 7: initd: blk stopped" build/boot.log
        grep -q "kernel reached idle state" build/boot.log
    - name: Check the block write reached the disk
      run: ./tools/check-disk-write.sh
    - name: Check the FAT32 partition on the disk
      run: ./tools/check-disk-fs.sh
    - name: Check the ext2 partition on the disk
      run: ./tools/check-disk-ext2.sh
    - name: Check the zcfs partition on the disk
      run: ./tools/check-disk-zcfs.sh
    - name: Check the fsck repair
      run: ./tools/check-fsck.sh

    # Closing a window ends its session and erases it, so its final frame has no
    # window in it — the two frame proofs are alternatives, and only a second run
    # can cover the other one (ADR 0026). This build serves the same scripted
    # gestures plus the close click.
    - name: Build the close-proof image
      run: ./tools/build-efi.sh --test-close
    - name: Boot test the close proof
      run: ./tools/run-qemu.sh --test-close > build/boot-close.log 2>&1
    - name: Check the close proof
      run: |
        cat build/boot-close.log
        # The window is closed, so the client ends through the path it already
        # used and the compositor erases the remembered footprint.
        grep -q "compositor: window dragged" build/boot-close.log
        grep -q "compositor: window minimized" build/boot-close.log
        grep -q "compositor: window restored" build/boot-close.log
        grep -q "compositor: window closed" build/boot-close.log
        grep -q "compositor: window erased" build/boot-close.log
        grep -q "task 8: client: window painted" build/boot-close.log
        # With no window on screen the desktop half of the check becomes total:
        # every pixel, including the vacated footprint, recomputes exactly.
        grep -q "fb: no window, placement skipped" build/boot-close.log
        grep -q "wm: content ok" build/boot-close.log
        # The window's own pointer stream survives the close: queued events are
        # delivered before the end-of-session sentinel.
        grep -q "wm: pointer routed" build/boot-close.log
        grep -q "task 8: client: pointer ok" build/boot-close.log
        # The whole scripted pointer session was served before the close.
        grep -q "wm: mouse script served" build/boot-close.log
        # The widget detour is in the shared prefix, so the close run proves
        # both widgets and the focus too before the window is erased
        # (ADR 0088, ADR 0089).
        grep -q "task 8: client: click ok" build/boot-close.log
        grep -q "task 8: client: reset ok" build/boot-close.log
        grep -q "task 8: client: focus ok" build/boot-close.log
        grep -q "wm: click ok" build/boot-close.log
        grep -q "wm: reset ok" build/boot-close.log
        grep -q "wm: focus ok" build/boot-close.log
        # The listing is in the shared prefix too, so the close run proves the
        # window's `ls` reached the VFS before the window is erased.
        grep -q "task 8: client: ls ok" build/boot-close.log
        grep -q "wm: ls ok" build/boot-close.log
        # Same font pipeline as the window-up run: the close run drags,
        # minimizes, and restores before closing, so all three sides render.
        grep -q "task 8: client: font vfs ok" build/boot-close.log
        grep -q "task 3: compositor: font vfs ok" build/boot-close.log
        grep -q "font: vfs ok" build/boot-close.log
        ! grep -q "font embedded fallback" build/boot-close.log
        grep -q "clock: proof" build/boot-close.log
        grep -q "compositor: clock fixed" build/boot-close.log
        ! grep -q "compositor: clock tick" build/boot-close.log
        grep -q "fb: desktop checksum ok" build/boot-close.log
        ! grep -q "cursor checksum mismatch" build/boot-close.log
        ! grep -q "desktop checksum mismatch" build/boot-close.log
        grep -q "kernel reached idle state" build/boot-close.log

    # A third frame proof: the two-window image. Its scripted session presses the
    # launcher, the compositor opens window 1, and the verifier proves both window
    # regions. It is its own image (zcos-fm.img) and its own log for the same
    # reason the close proof is: the scripted single-window frame must stay
    # byte-identical, and packing fm.elf into that proof's initramfs would change
    # the window's `ls` listing (and its checksum). The default image does pack
    # fm.elf for a person to use, but it serves no script and has no frame
    # checksum. Window 1 runs the file manager in the default and --fm images,
    # whose listing the kernel independently recomputes from its mount table, so
    # `wm: content ok` appears twice — once per window — in the --fm run.
    #
    # The script then clicks the `dev/` row inside window 1, walks back with the
    # `..` row, and double-clicks `hello.txt`. The client lists with
    # `SYS_READDIR` and reads with `SYS_OPEN`/`SYS_READ`; the verifier replays
    # the same clicks into the same `Fm` state machine over its own mount table,
    # so the `/hello.txt` title and preview bytes in the final frame are derived
    # rather than trusted.
    - name: Build the two-window image
      run: ./tools/build-efi.sh --fm
    - name: Boot test the two-window proof
      run: ./tools/run-qemu.sh --fm > build/boot-fm.log 2>&1
    - name: Check the two-window proof
      run: |
        cat build/boot-fm.log
        grep -q "win1 entry" build/boot-fm.log
        grep -q "compositor: window 1 launched" build/boot-fm.log
        grep -q "task 9: fm: ready" build/boot-fm.log
        grep -q "task 9: fm: listing ok" build/boot-fm.log
        grep -q "task 9: fm: pointer ok" build/boot-fm.log
        # The clicks opened a directory and then a file, not only arrived: both
        # sides log each transition.
        grep -q "task 9: fm: open ok" build/boot-fm.log
        grep -q "task 9: fm: preview ok" build/boot-fm.log
        grep -q "task 9: fm: window painted" build/boot-fm.log
        # Window 1's content is proven by the kernel listing the same directory
        # and reading the same file through its own mount table while replaying
        # the same clicks.
        grep -q "fm: listing ok" build/boot-fm.log
        grep -q "fm: open ok" build/boot-fm.log
        grep -q "fm: preview ok" build/boot-fm.log
        # Both windows reach the content check: window 0 (terminal) and window 1
        # (file manager), so exactly two `wm: content ok` lines.
        test "$(grep -c 'wm: content ok' build/boot-fm.log)" -eq 2
        # Window 0 shares the widget detour, so the two-window run proves both
        # widgets and the focus as well (ADR 0088, ADR 0089).
        grep -q "task 8: client: click ok" build/boot-fm.log
        grep -q "task 8: client: reset ok" build/boot-fm.log
        grep -q "task 8: client: focus ok" build/boot-fm.log
        grep -q "wm: click ok" build/boot-fm.log
        grep -q "wm: reset ok" build/boot-fm.log
        grep -q "wm: focus ok" build/boot-fm.log
        # The whole scripted pointer session was served, and the verifier now
        # replays the listings the kernel actually served each client (ADR
        # 0090) — the fm walk included.
        grep -q "wm: mouse script served" build/boot-fm.log
        grep -q "clock: proof" build/boot-fm.log
        grep -q "compositor: clock fixed" build/boot-fm.log
        ! grep -q "compositor: clock tick" build/boot-fm.log
        grep -q "fb: desktop checksum ok" build/boot-fm.log
        ! grep -q "fm window did not open hello.txt" build/boot-fm.log
        ! grep -q "fm window read no file" build/boot-fm.log
        ! grep -q "window placement mismatch" build/boot-fm.log
        ! grep -q "window content mismatch" build/boot-fm.log
        ! grep -q "cursor checksum mismatch" build/boot-fm.log
        ! grep -q "desktop checksum mismatch" build/boot-fm.log
        ! grep -q "ipc deadlock" build/boot-fm.log
        grep -q "kernel reached idle state" build/boot-fm.log

    # The two boot checks above prove the *scripted* frame. They say nothing about
    # input a person types, and a written claim to the contrary once survived
    # review here precisely because nothing typed anything (ADR 0030).
    #
    # This needs a normal (non-`--test`) image: the watchdog is armed only in the
    # test builds, and typing leaves the session running by design, so a machine
    # that is *supposed* to stay up is what we are checking. This is also the
    # human-testable default image, which now packs the file manager; the check
    # asserts `task 9: fm: ready` so CI cannot prove a CI-only image while the
    # one a person boots is missing the app. It writes build/zcos.img, separately
    # from the test, close, and two-window proof images and logs.
    - name: Build the interactive image for the live-input check
      run: ./tools/build-efi.sh
    - name: Prove typed input reaches the window
      run: ./tools/check-live-input.sh

    # `check-live-input` types into the *window client*, which reads
    # `SYS_TERM_READ`. Nothing yet drove the other input path: the shell's
    # `SYS_SERIAL_READ`, the one a person at a serial console actually uses.
    # That path is where a waiting syscall re-enables interrupts, and where
    # the shared-IST bug hid (ADR 0033), so it needs its own end-to-end
    # proof. It ends the session by powering the machine off, which also
    # covers F8k-1: the guest must flush `/data`, announce the shutdown, and
    # let QEMU exit 0 with the filesystem still consistent on the host.
    - name: Prove a typed shell command powers the machine off cleanly
      run: ./tools/check-poweroff.sh

    # A red boot step currently shows nothing: both runs redirect the emulator
    # output into a log file that no later step reads, so a failure like
    # "Boot test the close proof exited 1" arrives with zero evidence about
    # whether the image was missing, the staleness guard refused, QEMU died,
    # or the guest failed. This step runs only on failure and changes no
    # pass/fail semantics; it just makes the next red step self-explaining.
    # The disk listing matters too: a full runner disk fails image and disk
    # writes that succeed everywhere else, and nothing else would say so.
    - name: Show boot logs on failure
      if: failure()
      run: |
        echo "--- runner disk state ---"
        df -h "$GITHUB_WORKSPACE" | tail -2
        echo "--- build/ contents ---"
        ls -la build/ || true
        echo "--- target/ size ---"
        du -sh target 2>/dev/null || true
        echo "===== build/boot.log (tail) ====="
        tail -60 build/boot.log 2>/dev/null || echo "(missing)"
        echo "===== build/boot-close.log (tail) ====="
        tail -60 build/boot-close.log 2>/dev/null || echo "(missing)"
        echo "===== build/boot-fm.log (tail) ====="
        tail -60 build/boot-fm.log 2>/dev/null || echo "(missing)"
