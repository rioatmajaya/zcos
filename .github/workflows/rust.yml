name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build workspace
      run: cargo build --workspace --verbose
    - name: Run host tests
      run: cargo test --workspace --verbose

  boot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install QEMU, OVMF, and image tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools
    - name: Install UEFI target
      run: rustup target add x86_64-unknown-uefi
    - name: Build bootable image
      run: ./tools/build-efi.sh --test
    - name: Boot test in QEMU
      run: ./tools/run-qemu.sh --test > build/boot.log 2>&1
    - name: Check boot diagnostics
      run: |
        cat build/boot.log
        grep -q "memory map:" build/boot.log
        grep -q "framebuffer" build/boot.log
        grep -q "ACPI RSDP" build/boot.log
