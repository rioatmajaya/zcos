name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build workspace
      run: cargo build --workspace --verbose
    - name: Run host tests
      run: cargo test --workspace --verbose

  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check the changelog has an Unreleased section
      run: |
        test -f CHANGELOG.md
        grep -q '^## \[Unreleased\]' CHANGELOG.md

  boot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install QEMU, OVMF, and image tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools e2fsprogs
    - name: Install boot targets
      run: |
        rustup target add x86_64-unknown-uefi
        rustup target add x86_64-unknown-none
    - name: Build bootable image
      run: ./tools/build-efi.sh --test
    - name: Boot test in QEMU
      run: ./tools/run-qemu.sh --test > build/boot.log 2>&1
    - name: Check boot diagnostics
      run: |
        cat build/boot.log
        grep -q "ZC OS UEFI loader" build/boot.log
        grep -q "framebuffer" build/boot.log
        grep -q "memory map:" build/boot.log
        grep -q "entering kernel" build/boot.log
        grep -q "ZC OS kernel" build/boot.log
        grep -q "boot protocol v2 ok" build/boot.log
        grep -q "mechanisms self-test ok" build/boot.log
        grep -q "traps: idt installed" build/boot.log
        grep -q "syscall gate probe: 1" build/boot.log
        grep -q "timer: 16 ticks" build/boot.log
        grep -q "timer: calibrated bus" build/boot.log
        grep -q "user: exited" build/boot.log
        grep -q "task 0: producer sent 2000" build/boot.log
        grep -q "task 1: consumer received 2000" build/boot.log
        grep -q "task 1: hello verified" build/boot.log
        grep -q "task 0: manifest ok" build/boot.log
        grep -q "task 2: Commands: help echo cat stat write tmp persist chmod mount umount exit" build/boot.log
        grep -q "task 2: hello os" build/boot.log
        grep -q "task 2: hello from the ZC OS initramfs" build/boot.log
        grep -q "task 2: hello.txt: file, 31 bytes" build/boot.log
        grep -q "task 2: shell exiting" build/boot.log
        grep -q "vfs: mounted ramfs at /" build/boot.log
        # The kernel no longer scans PCI: the device manager does, from ring 3,
        # and brokers the BAR it finds (ADR 0019).
        ! grep -q "^pci:" build/boot.log
        grep -q "task 4: blk: disk magic ok" build/boot.log
        grep -q "task 4: blk: write ok" build/boot.log
        grep -q "task 4: blk: flush ok" build/boot.log
        grep -q "task 4: blk: readback ok" build/boot.log
        grep -q "task 4: blk: cache miss" build/boot.log
        grep -q "task 4: blk: cache hit" build/boot.log
        grep -q "task 4: blk: cache dirty hit" build/boot.log
        grep -q "task 4: blk: cache evicted dirty" build/boot.log
        grep -q "task 4: blk: cache flushed" build/boot.log
        grep -q "task 4: blk: cache durable" build/boot.log
        grep -q "task 4: blk: fs mbr ok" build/boot.log
        grep -q "task 4: blk: fs mount ok" build/boot.log
        grep -q "task 4: blk: fs root ok" build/boot.log
        grep -q "task 4: blk: fs hello ok" build/boot.log
        grep -q "task 4: blk: ext2 mbr ok" build/boot.log
        grep -q "task 4: blk: ext2 mount ok" build/boot.log
        grep -q "task 4: blk: ext2 root ok" build/boot.log
        grep -q "task 4: blk: ext2 hello ok" build/boot.log
        grep -q "task 4: blk: zcfs mbr ok" build/boot.log
        grep -q "task 4: blk: zcfs mount ok" build/boot.log
        grep -q "task 4: blk: zcfs recovered" build/boot.log
        grep -q "task 4: blk: zcfs dirty" build/boot.log
        grep -q "task 4: blk: zcfs fsck repaired" build/boot.log
        grep -q "task 4: blk: zcfs probe ok" build/boot.log
        grep -q "task 4: blk: zcfs write ok" build/boot.log
        grep -q "task 4: blk: zcfs replay ok" build/boot.log
        grep -q "vfs: mounted zcfs at /data" build/boot.log
        grep -q "vfs: mounted tmpfs at /tmp" build/boot.log
        grep -q "vfs: mounted devfs at /dev" build/boot.log
        grep -q "task 4: blk: zcfs serving" build/boot.log
        grep -q "task 2: write: ok" build/boot.log
        grep -q "task 2: /data/probe: file, 10 bytes" build/boot.log
        grep -q "vfs: persistence ok" build/boot.log
        grep -q "task 2: tmp: ok" build/boot.log
        grep -q "task 2: /dev/blk: char device" build/boot.log
        grep -q "task 2: /tmp/scratch: file, 8 bytes, mode 0644, uid 1 gid 1" build/boot.log
        grep -q "task 2: chmod: ok" build/boot.log
        grep -q "audit: task 2 denied read /tmp/scratch" build/boot.log
        grep -q "task 2: cat: cannot open" build/boot.log
        grep -q "task 4: blk: zcfs stopped" build/boot.log
        grep -q "user: 9 address spaces" build/boot.log
        grep -q "device: 3 roles, 7 grants (blk 0, kbd 4, devmgr 3)" build/boot.log
        grep -q "service: 2 roles, 2 grants (initd -> blk, kbd)" build/boot.log
        grep -q "cap: task 6 delegated" build/boot.log
        grep -q "to task 4" build/boot.log
        grep -q "iomap: task 4 now holds 256 ports" build/boot.log
        grep -q "iomap: task 6 now holds 8 ports" build/boot.log
        grep -q "task 6: devmgr: blk published" build/boot.log
        # Device memory is brokered the same way as I/O (ADR 0020): the manager
        # discovers the AHCI BAR, the kernel validates and records a range it
        # never knew, and the domain maps its own registers uncached. A range
        # the kernel owns is refused, so brokering leaks no memory.
        grep -q "task 6: devmgr: mmio ram range refused" build/boot.log
        grep -q "task 6: devmgr: mmio oversized refused" build/boot.log
        grep -q "mmio: task 6 delegated" build/boot.log
        grep -q "to task 6" build/boot.log
        grep -q "task 6: mmio: task 6 mapped ahci" build/boot.log
        ! grep -q "devmgr: mmio ram range accepted" build/boot.log
        ! grep -q "devmgr: mmio oversized accepted" build/boot.log
        ! grep -q "devmgr: ahci registers unexpected" build/boot.log
        # A role that drives a DMA device gets a coherent window at spawn: the
        # kernel allocates one contiguous run, maps it at a fixed address, and
        # publishes the device-visible base; the manager writes proof words
        # through the virtual alias and the kernel reads them back through the
        # physical one, so a match proves the two are the same frames.
        grep -q "dma: window 65536 bytes at 0x2400000" build/boot.log
        grep -q "task 6: devmgr: dma window at" build/boot.log
        grep -q "dma: window coherent ok" build/boot.log
        ! grep -q "dma: window coherent FAILED" build/boot.log
        ! grep -q "dma window needs contiguous frames" build/boot.log
        grep -q "task 4: blk: discovery received" build/boot.log
        grep -q "iomap: task 5 now holds 3 ports" build/boot.log
        grep -q "kbd: unprovided source correctly refused" build/boot.log
        grep -q "kbd: unprovided ports correctly refused" build/boot.log
        grep -q "task 5: kbd: irq 33 delivered" build/boot.log
        grep -q "kbd: irq 34 delivered, mouse queue ready" build/boot.log
        grep -q "kbd: task 5 released 3 ports" build/boot.log
        grep -q "fault vector 13 (general protection)" build/boot.log
        grep -q "task 7: initd: kbd down" build/boot.log
        grep -q "task 7: initd: restarted kbd" build/boot.log
        grep -q "task 7: service kbd started, task 5 revived" build/boot.log
        grep -q "task 5: kbd: serving" build/boot.log
        grep -q "task 7: initd: kbd stopped" build/boot.log
        ! grep -q "forbidden port read succeeded" build/boot.log
        grep -q "input: loopback ok" build/boot.log
        grep -q "input: mouse loopback ok" build/boot.log
        grep -q "input: irq self-test ok" build/boot.log
        grep -q "input: mouse irq self-test ok" build/boot.log
        grep -q "surface: factory granted to task 3" build/boot.log
        grep -q "task 3: compositor: surface 1280x800 stride 1280 at 0x1400000" build/boot.log
        grep -q "cap: task 3 delegated 0x20000001 to task 8" build/boot.log
        grep -q "task 8: client: window painted" build/boot.log
        grep -q "task 3: compositor: frame 0 painted" build/boot.log
        grep -q "task 3: wm: window mapped" build/boot.log
        grep -q "task 3: compositor: damage ok" build/boot.log
        grep -q "task 3: wm: move ok" build/boot.log
        grep -q "task 3: compositor: frame updated" build/boot.log
        grep -q "task 3: compositor: ready" build/boot.log
        grep -q "wm: content ok" build/boot.log
        grep -q "wm: vfs content ok" build/boot.log
        grep -q "task 8: client: vfs ok" build/boot.log
        # The font is an initramfs asset now (ADR 0031): all three text
        # renderers load it through the VFS, and none may silently fall back.
        grep -q "task 8: client: font vfs ok" build/boot.log
        grep -q "task 3: compositor: font vfs ok" build/boot.log
        grep -q "font: vfs ok" build/boot.log
        ! grep -q "font embedded fallback" build/boot.log
        ! grep -q "window script read no file" build/boot.log
        ! grep -q "window content mismatch" build/boot.log
        # The pointer is composited topmost and the kernel recomputes its sprite
        # from the same reports it served; the compositor moves it with damage
        # tracking, so the session logs a move and the verifier confirms every
        # sprite pixel instead of trusting the compositor's position.
        grep -q "task 3: compositor: cursor moved" build/boot.log
        grep -q "task 3: compositor: cursor ok" build/boot.log
        grep -q "fb: cursor ok" build/boot.log
        # The pointer is not just drawn, it is driven: the scripted mouse session
        # presses the left button on the window's title bar, drags the window off
        # its scripted frame position, releases, clicks the minimize glyph, and
        # clicks the taskbar's task button to bring it back. The window machine
        # runs on both sides (ADR 0024), so the desktop checksum still recomputes
        # the desktop exactly around wherever the window ended up — and this
        # variant leaves the window on screen, which is what proves the compositor
        # placed the client's pixels (ADR 0018).
        grep -q "compositor: window dragged" build/boot.log
        grep -q "compositor: window minimized" build/boot.log
        grep -q "compositor: window restored" build/boot.log
        ! grep -q "compositor: window closed" build/boot.log
        ! grep -q "cursor checksum mismatch" build/boot.log
        ! grep -q "desktop checksum mismatch" build/boot.log
        ! grep -q "window placement mismatch" build/boot.log
        ! grep -q "fb: no window, placement skipped" build/boot.log
        grep -q "fb: desktop checksum ok" build/boot.log
        grep -q "switches" build/boot.log
        grep -q "acpi: rsdp v2" build/boot.log
        grep -q "initramfs: 12 files" build/boot.log
        grep -q "task 4: blk: resuming" build/boot.log
        grep -q "task 7: initd: blk down" build/boot.log
        grep -q "task 7: service blk started, task 4 revived" build/boot.log
        grep -q "task 7: initd: restarted blk" build/boot.log
        grep -q "task 4: blk: zcfs serving" build/boot.log
        grep -q "task 7: initd: blk stopped" build/boot.log
        grep -q "kernel reached idle state" build/boot.log
    - name: Check the block write reached the disk
      run: ./tools/check-disk-write.sh
    - name: Check the FAT32 partition on the disk
      run: ./tools/check-disk-fs.sh
    - name: Check the ext2 partition on the disk
      run: ./tools/check-disk-ext2.sh
    - name: Check the zcfs partition on the disk
      run: ./tools/check-disk-zcfs.sh
    - name: Check the fsck repair
      run: ./tools/check-fsck.sh

    # Closing a window ends its session and erases it, so its final frame has no
    # window in it — the two frame proofs are alternatives, and only a second run
    # can cover the other one (ADR 0026). This build serves the same scripted
    # gestures plus the close click.
    - name: Build the close-proof image
      run: ./tools/build-efi.sh --test-close
    - name: Boot test the close proof
      run: ./tools/run-qemu.sh --test-close > build/boot-close.log 2>&1
    - name: Check the close proof
      run: |
        cat build/boot-close.log
        # The window is closed, so the client ends through the path it already
        # used and the compositor erases the remembered footprint.
        grep -q "compositor: window dragged" build/boot-close.log
        grep -q "compositor: window minimized" build/boot-close.log
        grep -q "compositor: window restored" build/boot-close.log
        grep -q "compositor: window closed" build/boot-close.log
        grep -q "compositor: window erased" build/boot-close.log
        grep -q "task 8: client: window painted" build/boot-close.log
        # With no window on screen the desktop half of the check becomes total:
        # every pixel, including the vacated footprint, recomputes exactly.
        grep -q "fb: no window, placement skipped" build/boot-close.log
        grep -q "wm: content ok" build/boot-close.log
        # Same font pipeline as the window-up run: the close run drags,
        # minimizes, and restores before closing, so all three sides render.
        grep -q "task 8: client: font vfs ok" build/boot-close.log
        grep -q "task 3: compositor: font vfs ok" build/boot-close.log
        grep -q "font: vfs ok" build/boot-close.log
        ! grep -q "font embedded fallback" build/boot-close.log
        grep -q "fb: desktop checksum ok" build/boot-close.log
        ! grep -q "cursor checksum mismatch" build/boot-close.log
        ! grep -q "desktop checksum mismatch" build/boot-close.log
        grep -q "kernel reached idle state" build/boot-close.log

    # The two boot checks above prove the *scripted* frame. They say nothing about
    # input a person types, and a written claim to the contrary once survived
    # review here precisely because nothing typed anything (ADR 0030).
    #
    # This needs a normal (non-`--test`) image: the watchdog is armed only in the
    # test builds, and typing leaves the session running by design, so a machine
    # that is *supposed* to stay up is what we are checking. It writes its own
    # image, so it cannot disturb the two logs above.
    - name: Build the interactive image for the live-input check
      run: ./tools/build-efi.sh
    - name: Prove typed input reaches the window
      run: ./tools/check-live-input.sh

    # A red boot step currently shows nothing: both runs redirect the emulator
    # output into a log file that no later step reads, so a failure like
    # "Boot test the close proof exited 1" arrives with zero evidence about
    # whether the image was missing, the staleness guard refused, QEMU died,
    # or the guest failed. This step runs only on failure and changes no
    # pass/fail semantics; it just makes the next red step self-explaining.
    # The disk listing matters too: a full runner disk fails image and disk
    # writes that succeed everywhere else, and nothing else would say so.
    - name: Show boot logs on failure
      if: failure()
      run: |
        echo "--- runner disk state ---"
        df -h "$GITHUB_WORKSPACE" | tail -2
        echo "--- build/ contents ---"
        ls -la build/ || true
        echo "--- target/ size ---"
        du -sh target 2>/dev/null || true
        echo "===== build/boot.log (tail) ====="
        tail -60 build/boot.log 2>/dev/null || echo "(missing)"
        echo "===== build/boot-close.log (tail) ====="
        tail -60 build/boot-close.log 2>/dev/null || echo "(missing)"
