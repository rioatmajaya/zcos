name: Rust

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

env:
  CARGO_TERM_COLOR: always

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Build workspace
      run: cargo build --workspace --verbose
    - name: Run host tests
      run: cargo test --workspace --verbose

  changelog:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Check the changelog has an Unreleased section
      run: |
        test -f CHANGELOG.md
        grep -q '^## \[Unreleased\]' CHANGELOG.md

  boot:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Install QEMU, OVMF, and image tools
      run: |
        sudo apt-get update
        sudo apt-get install -y qemu-system-x86 ovmf mtools dosfstools e2fsprogs
    - name: Install boot targets
      run: |
        rustup target add x86_64-unknown-uefi
        rustup target add x86_64-unknown-none
    - name: Build bootable image
      run: ./tools/build-efi.sh --test
    - name: Boot test in QEMU
      run: ./tools/run-qemu.sh --test > build/boot.log 2>&1
    - name: Check boot diagnostics
      run: |
        cat build/boot.log
        grep -q "ZC OS UEFI loader" build/boot.log
        grep -q "framebuffer" build/boot.log
        grep -q "memory map:" build/boot.log
        grep -q "entering kernel" build/boot.log
        grep -q "ZC OS kernel" build/boot.log
        grep -q "boot protocol v2 ok" build/boot.log
        grep -q "mechanisms self-test ok" build/boot.log
        grep -q "traps: idt installed" build/boot.log
        grep -q "syscall gate probe: 1" build/boot.log
        grep -q "timer: 16 ticks" build/boot.log
        grep -q "timer: calibrated bus" build/boot.log
        grep -q "user: exited" build/boot.log
        grep -q "task 0: producer sent 2000" build/boot.log
        grep -q "task 1: consumer received 2000" build/boot.log
        grep -q "task 1: hello verified" build/boot.log
        grep -q "task 0: manifest ok" build/boot.log
        grep -q "task 2: Commands: help echo cat stat exit" build/boot.log
        grep -q "task 2: hello os" build/boot.log
        grep -q "task 2: hello from the ZC OS initramfs" build/boot.log
        grep -q "task 2: hello.txt: file, 31 bytes" build/boot.log
        grep -q "task 2: shell exiting" build/boot.log
        grep -q "vfs: mounted ramfs at /" build/boot.log
        grep -q "pci: 7 functions" build/boot.log
        grep -q "pci: blk device 00:02.0 claimed by driver task" build/boot.log
        grep -q "task 4: blk: disk magic ok" build/boot.log
        grep -q "task 4: blk: write ok" build/boot.log
        grep -q "task 4: blk: flush ok" build/boot.log
        grep -q "task 4: blk: readback ok" build/boot.log
        grep -q "task 4: blk: cache miss" build/boot.log
        grep -q "task 4: blk: cache hit" build/boot.log
        grep -q "task 4: blk: cache dirty hit" build/boot.log
        grep -q "task 4: blk: cache evicted dirty" build/boot.log
        grep -q "task 4: blk: cache flushed" build/boot.log
        grep -q "task 4: blk: cache durable" build/boot.log
        grep -q "task 4: blk: fs mbr ok" build/boot.log
        grep -q "task 4: blk: fs mount ok" build/boot.log
        grep -q "task 4: blk: fs root ok" build/boot.log
        grep -q "task 4: blk: fs hello ok" build/boot.log
        grep -q "task 4: blk: ext2 mbr ok" build/boot.log
        grep -q "task 4: blk: ext2 mount ok" build/boot.log
        grep -q "task 4: blk: ext2 root ok" build/boot.log
        grep -q "task 4: blk: ext2 hello ok" build/boot.log
        grep -q "user: 7 address spaces" build/boot.log
        grep -q "device: 3 roles, 5 grants (blk 0, kbd 3, devmgr 2)" build/boot.log
        grep -q "cap: task 6 delegated" build/boot.log
        grep -q "to task 4" build/boot.log
        grep -q "iomap: task 4 now holds 256 ports" build/boot.log
        grep -q "iomap: task 6 now holds 8 ports" build/boot.log
        grep -q "task 6: devmgr: blk published" build/boot.log
        grep -q "task 4: blk: discovery received" build/boot.log
        grep -q "iomap: task 5 now holds 3 ports" build/boot.log
        grep -q "kbd: unprovided source correctly refused" build/boot.log
        grep -q "kbd: unprovided ports correctly refused" build/boot.log
        grep -q "task 5: kbd: irq 33 delivered" build/boot.log
        grep -q "kbd: task 5 released 3 ports" build/boot.log
        grep -q "fault vector 13 (general protection)" build/boot.log
        grep -q "restarting (budget 0 left)" build/boot.log
        grep -q "kernel survived" build/boot.log
        ! grep -q "forbidden port read succeeded" build/boot.log
        grep -q "input: loopback ok" build/boot.log
        grep -q "input: irq self-test ok" build/boot.log
        grep -q "task 3: fb painted" build/boot.log
        grep -q "task 3: fb painted" build/boot.log
        grep -q "fb: checksum ok" build/boot.log
        grep -q "switches" build/boot.log
        grep -q "acpi: rsdp v2" build/boot.log
        grep -q "initramfs: 9 files" build/boot.log
        grep -q "kernel reached idle state" build/boot.log
    - name: Check the block write reached the disk
      run: ./tools/check-disk-write.sh
    - name: Check the FAT32 partition on the disk
      run: ./tools/check-disk-fs.sh
    - name: Check the ext2 partition on the disk
      run: ./tools/check-disk-ext2.sh
