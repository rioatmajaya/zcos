[package]
name = "win"
description = "Window client for ZC OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
publish = false
build = "build.rs"

[[bin]]
name = "win"
path = "src/main.rs"

[dependencies]
zc-user = { path = "../zc-user" }
zc-ui = { path = "../zc-ui" }
zc-abi = { path = "../../libs/zc-abi" }

[features]
# Serve as a real second-window client: block on window 1's assignment channel
# and run the terminal. Off by default, where window 1 proves it booted and finds
# its channel, then exits — because the shipped boot never launches a second
# window and a lone client blocked on an unassigned channel deadlocks it. The
# `--fm` build turns it on to prove two windows end to end.
fm-proof = []

[lints]
workspace = true

# Built standalone outside the host workspace (its freestanding binary
# would otherwise fail `cargo test`); the `*.workspace = true` references
# resolve to the concrete values below.
[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/zc-os/zcos"

[workspace.lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
