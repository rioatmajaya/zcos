[package]
name = "zc-uefi-loader"
description = "UEFI entry point and early boot services for ZC OS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
zc-abi = { path = "../../libs/zc-abi" }
zc-elf = { path = "../../libs/zc-elf" }

[features]
# Terminate QEMU through isa-debug-exit so an automated boot test ends with a
# status code. Never enable this for a real firmware build.
qemu-exit = []

[lints]
workspace = true
